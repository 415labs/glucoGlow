; glucoGlow (ESP32-C3): bedside glucose display for ESP32-C3 0.42" OLED board

[env:esp32-c3-devkitm-1]
; Pinned to Arduino-ESP32 2.0.x (setCACertBundle signature used in llu_client.cpp)
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    olikraus/U8g2@^2.35.19
    bblanchon/ArduinoJson@^7.0.4

; Same firmware, but cycles fake readings (no LibreLinkUp login needed)
[env:mock]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    -DMOCK_GLUCOSE

; Host-side unit tests for the pure logic (glucose.cpp, settings.h)
[env:native]
platform = native
test_framework = unity
test_filter = test_glucose
test_build_src = yes
build_src_filter = -<*> +<glucose.cpp>
build_flags = -std=gnu++17 -Isrc
